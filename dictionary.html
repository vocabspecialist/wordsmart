<!DOCTYPE html>
<html lang="bn"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>অভিধান — শব্দভান্ডার</title>
<link rel="stylesheet" href="style.css">
<style>
.dict-layout{display:grid;grid-template-columns:270px 1fr;height:calc(100vh - var(--nav));overflow:hidden;}
@media(max-width:700px){.dict-layout{grid-template-columns:1fr;height:auto;}}
.sidebar{border-right:2px solid var(--ink);display:flex;flex-direction:column;overflow:hidden;background:white;transition:background .3s,border-color .3s;}
@media(max-width:700px){.sidebar{height:260px;}}
.search-wrap{padding:.85rem;border-bottom:2px solid var(--paper-warm);}
.search-input{width:100%;padding:.6rem .9rem;border:2px solid var(--ink);border-radius:9px;font-family:'Hind Siliguri',sans-serif;font-size:.9rem;background:var(--paper);color:var(--text);}
.search-input:focus{outline:none;border-color:var(--accent2);}
.alpha-wrap{padding:.5rem .65rem;border-bottom:1px solid var(--paper-warm);display:flex;flex-wrap:wrap;gap:.12rem;}
.ab{width:24px;height:24px;border:none;background:none;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:.67rem;font-weight:600;cursor:pointer;color:var(--muted);transition:all .15s;display:flex;align-items:center;justify-content:center;}
.ab:hover{background:var(--paper-warm);color:var(--text);}
.ab.active{background:var(--ink);color:white;}
.wcount{padding:.35rem .9rem;font-family:'JetBrains Mono',monospace;font-size:.67rem;color:var(--muted);border-bottom:1px solid var(--paper-warm);}
.wlist{flex:1;overflow-y:auto;padding:.35rem 0;}
.wlist::-webkit-scrollbar{width:3px;}.wlist::-webkit-scrollbar-thumb{background:var(--paper-warm);}
.wi{padding:.55rem .9rem;cursor:pointer;transition:background .15s;display:flex;align-items:center;justify-content:space-between;border-left:3px solid transparent;}
.wi:hover{background:var(--paper-warm);}
.wi.wactive{background:#e8f4fd;border-left-color:var(--accent2);}
.wi.wlearned{border-left-color:var(--accent3);}
[data-theme="dark"] .wi.wactive{background:#0e2233;}
.wi-txt{font-weight:600;font-size:.9rem;}
.wi-m{font-size:.72rem;color:var(--muted);margin-top:.08rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:160px;}
.ldot{width:6px;height:6px;border-radius:50%;background:var(--accent3);flex-shrink:0;}
.dmain{overflow-y:auto;padding:1.75rem 1.5rem;}
.dmain::-webkit-scrollbar{width:4px;}.dmain::-webkit-scrollbar-thumb{background:var(--paper-warm);}
@media(max-width:700px){.dmain{padding:1.25rem .9rem;}}
.empty-state{text-align:center;padding:4rem 1rem;color:var(--muted);}
.wd-num{font-family:'JetBrains Mono',monospace;font-size:.75rem;color:var(--muted);margin-bottom:.2rem;}
.wd-row{display:flex;align-items:flex-start;justify-content:space-between;gap:1rem;margin-bottom:1.25rem;flex-wrap:wrap;}
.wd-word{font-family:'Playfair Display',serif;font-size:clamp(2.2rem,5vw,3.2rem);font-weight:900;color:var(--ink);line-height:1;}
.spk-btn{background:var(--paper-warm);border:2px solid var(--ink);border-radius:8px;padding:.45rem .9rem;font-size:.9rem;cursor:pointer;transition:all .2s;white-space:nowrap;}
.spk-btn:hover{background:var(--ink);color:white;}
.wd-meaning{font-size:1.3rem;font-weight:600;color:var(--accent);margin-bottom:.2rem;}
.mark-btn{padding:.5rem 1.1rem;border-radius:9px;border:2px solid var(--ink);background:white;cursor:pointer;font-family:'Hind Siliguri',sans-serif;font-size:.82rem;font-weight:600;white-space:nowrap;transition:all .2s;flex-shrink:0;}
.mark-btn.learned{background:var(--accent3);color:white;border-color:var(--accent3);}
.sent-box{background:var(--ink);color:white;border-radius:11px;padding:1.1rem 1.35rem;margin-bottom:1.4rem;}
.sent-lbl{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:var(--gold);margin-bottom:.4rem;}
.sent-txt{font-size:.92rem;line-height:1.6;color:rgba(255,255,255,.85);}
.sent-txt strong{color:var(--gold);}
.rel-grid{display:flex;flex-direction:column;gap:.5rem;margin-bottom:1.25rem;}
.rel-item{background:white;border:1.5px solid var(--paper-warm);border-radius:11px;padding:.85rem 1.1rem;transition:border-color .2s;cursor:pointer;display:flex;justify-content:space-between;align-items:flex-start;gap:.65rem;}
.rel-item:hover{border-color:var(--ink);}
.rel-item.syn{border-left:3px solid var(--accent3);}
.rel-item.ant{border-left:3px solid var(--accent);}
.rel-w{font-weight:700;font-size:1rem;margin-bottom:.15rem;}
.syn .rel-w{color:#1a6641;}.ant .rel-w{color:var(--accent);}
.rel-s{font-size:.82rem;color:var(--muted);line-height:1.5;font-style:italic;}
.rel-spk{background:none;border:1.5px solid var(--paper-warm);border-radius:5px;padding:.1rem .38rem;cursor:pointer;font-size:.78rem;flex-shrink:0;transition:all .15s;}
.rel-spk:hover{background:var(--paper-warm);}
</style>
</head><body>
<nav>
  <a href="index.html" class="nav-logo">শব্দ<span>ভান্ডার</span><small>Word Smart I & II</small></a>
  <ul id="desktop-nav"></ul><button id="hamburger" onclick="toggleMNav()">☰</button>
</nav>
<div id="mobile-nav"></div>
<div class="dict-layout">
  <div class="sidebar">
    <div class="search-wrap"><input class="search-input" id="si" placeholder="🔍 শব্দ খোঁজো..." oninput="filterW()"></div>
    <div class="alpha-wrap" id="alpha-wrap"></div>
    <div class="wcount" id="wcount">লোড হচ্ছে...</div>
    <div class="wlist" id="wlist"></div>
  </div>
  <div class="dmain" id="dmain"><div class="empty-state"><div style="font-size:3.5rem;margin-bottom:.75rem">📖</div><p>বাম দিক থেকে একটি শব্দ বেছে নাও।</p></div></div>
</div>

<script src="words_data.js"></script><script src="theme.js"></script><script src="nav.js"></script>
<script>
initNav('dictionary.html');initTheme();
let words=WORDS_DATA,filtered=[...words],learned={},cur=null;
function init(){
  learned=JSON.parse(localStorage.getItem('vm_learned')||'{}');
  buildAlpha();renderList();
  const id=localStorage.getItem('vm_wod_id');
  if(id){localStorage.removeItem('vm_wod_id');const w=words.find(x=>x.id==id);if(w)selectW(w);}
}
function buildAlpha(){
  const w=document.getElementById('alpha-wrap');
  const all=document.createElement('button');all.className='ab active';all.textContent='●';all.title='সব';
  all.onclick=()=>{document.querySelectorAll('.ab').forEach(b=>b.classList.remove('active'));all.classList.add('active');document.getElementById('si').value='';filtered=[...words];renderList();};
  w.appendChild(all);
  'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(l=>{
    const b=document.createElement('button');b.className='ab';b.textContent=l;
    b.onclick=()=>{document.querySelectorAll('.ab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('si').value='';filtered=words.filter(w=>w.word.toUpperCase().startsWith(l));renderList();};
    w.appendChild(b);
  });
}
function filterW(){
  const q=document.getElementById('si').value.toLowerCase().trim();
  document.querySelectorAll('.ab').forEach(b=>b.classList.remove('active'));
  filtered=q?words.filter(w=>w.word.toLowerCase().includes(q)||w.meaning.includes(q)):[...words];
  renderList();
}
function renderList(){
  document.getElementById('wcount').textContent=filtered.length+' শব্দ';
  document.getElementById('wlist').innerHTML=filtered.map(w=>`
    <div class="wi ${learned[w.id]?'wlearned':''} ${cur?.id===w.id?'wactive':''}" id="wi-${w.id}" onclick="selectWById(${w.id})">
      <div><div class="wi-txt">${w.word}</div><div class="wi-m">${w.meaning}</div></div>
      ${learned[w.id]?'<div class="ldot"></div>':''}
    </div>`).join('');
}
function selectWById(id){const w=words.find(x=>x.id===id);if(w)selectW(w);}
function selectW(w){
  cur=w;document.querySelectorAll('.wi').forEach(e=>e.classList.remove('wactive'));
  const el=document.getElementById('wi-'+w.id);if(el){el.classList.add('wactive');el.scrollIntoView({block:'nearest'});}
  renderDetail(w);
}
function renderDetail(w){
  const isL=learned[w.id];
  const hl=w.sentence?w.sentence.replace(new RegExp('\\b('+w.word+')\\b','gi'),'<strong>$1</strong>'):'—';
  let sh='',ah='';
  if(w.synonyms?.length){sh=`<div class="sec-lbl">সিনোনিম</div><div class="rel-grid">`+w.synonyms.map(s=>{const sent=w.synSentences?.[s]||'';return`<div class="rel-item syn" onclick="searchRel('${s}')"><div><div class="rel-w">${s}</div>${sent?`<div class="rel-s">"${sent}"</div>`:''}</div><button class="rel-spk" onclick="event.stopPropagation();speak('${s}')">🔊</button></div>`;}).join('')+'</div>';}
  if(w.antonyms?.length){ah=`<div class="sec-lbl">এন্টোনিম</div><div class="rel-grid">`+w.antonyms.map(a=>{const sent=w.antSentences?.[a]||'';return`<div class="rel-item ant" onclick="searchRel('${a}')"><div><div class="rel-w">${a}</div>${sent?`<div class="rel-s">"${sent}"</div>`:''}</div><button class="rel-spk" onclick="event.stopPropagation();speak('${a}')">🔊</button></div>`;}).join('')+'</div>';}
  document.getElementById('dmain').innerHTML=`
    <div style="max-width:660px">
      <div class="wd-num">#${String(w.id).padStart(3,'0')}</div>
      <div class="wd-row">
        <div><div style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;"><div class="wd-word">${w.word}</div><button class="spk-btn" onclick="speak('${w.word}')">🔊 উচ্চারণ</button></div><div class="wd-meaning">${w.meaning}</div></div>
        <button class="mark-btn ${isL?'learned':''}" id="mbtn" onclick="toggleLearn(${w.id})">${isL?'✓ শিখেছি':'+ শিখেছি'}</button>
      </div>
      ${w.sentence?`<div class="sent-box"><div class="sent-lbl">✦ উদাহরণ বাক্য</div><div class="sent-txt">${hl}</div></div>`:''}
      ${sh}${ah}
      ${!sh&&!ah?'<p style="color:var(--muted);font-size:.88rem">এই শব্দের সিনোনিম/এন্টোনিম পাওয়া যায়নি।</p>':''}
    </div>`;
  speak(w.word);
}
function toggleLearn(id){
  learned[id]=!learned[id];localStorage.setItem('vm_learned',JSON.stringify(learned));
  const btn=document.getElementById('mbtn');const item=document.getElementById('wi-'+id);
  if(learned[id]){btn.className='mark-btn learned';btn.textContent='✓ শিখেছি';if(item){item.classList.add('wlearned');if(!item.querySelector('.ldot')){const d=document.createElement('div');d.className='ldot';item.appendChild(d);}}}
  else{btn.className='mark-btn';btn.textContent='+ শিখেছি';if(item){item.classList.remove('wlearned');item.querySelector('.ldot')?.remove();}}
}
function searchRel(word){const f=words.find(w=>w.word.toLowerCase()===word.toLowerCase());if(f){selectW(f);}else{document.getElementById('si').value=word;filterW();}}
init();
</script>
</body></html>
